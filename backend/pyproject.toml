[project]
name = "turbodrone-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "scipy>=1.18.1",
    "starlette>=1.10.0",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.4",
]

[project.optional-dependencies]
follow = [
    "ultralytics>=8.4.203",
]
